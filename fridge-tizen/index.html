<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Family Hub Probe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">GOD'S EYE</div>
        <h1>Family Hub native probe</h1>
        <p>Packaged Tizen app test</p>
      </div>
      <button id="run">RUN TEST</button>
    </header>

    <section class="card intro">
      <strong>Goal</strong>
      <p>This build checks what Samsung exposes to an installed Tizen app that was hidden from the normal Family Hub browser.</p>
    </section>

    <section id="results" class="results"></section>

    <footer>
      <span id="status">Ready</span>
      <span>v1.0.0</span>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
