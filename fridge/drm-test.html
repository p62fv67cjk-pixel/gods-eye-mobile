<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Family Hub DRM Test</title><style>html,body{margin:0;background:#05070b;color:#f7f8fb;font-family:Arial,sans-serif}main{padding:34px}.top{display:flex;justify-content:space-between;align-items:center}.back{padding:12px 16px;border:1px solid #ffffff22;border-radius:14px;color:#fff;text-decoration:none;background:#171d28}h1{font-size:34px;margin:0 0 8px}.note{color:#9aa5b7;line-height:1.5;margin:18px 0 26px}.row{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #ffffff18;font-size:18px}.v{text-align:right;max-width:60%;word-break:break-word}.ok{color:#70e6a6}.no{color:#ff8089}.maybe{color:#ffd47c}button{margin-top:28px;width:100%;padding:20px;border:0;border-radius:18px;font-size:19px;font-weight:700}</style></head><body><main><div class="top"><div><h1>DRM test v2</h1><div>Family Hub / Tizen</div></div><a class="back" href="./">BACK</a></div><p class="note">Each DRM check has a 5-second timeout so Samsung's browser cannot leave the test stuck forever. This only detects exposed browser capabilities and does not bypass DRM.</p><div id="r"></div><button id="run">RUN AGAIN</button></main><script>const r=document.getElementById('r');function row(n,v,s){let c=s===true?'ok':s===false?'no':'maybe';return `<div class="row"><span>${n}</span><span class="v ${c}">${v}</span></div>`}function timeout(ms){return new Promise(res=>setTimeout(()=>res('TIMEOUT'),ms))}async function ks(name){if(!navigator.requestMediaKeySystemAccess)return 'NO EME';const cfg=[{initDataTypes:['cenc'],audioCapabilities:[{contentType:'audio/mp4; codecs="mp4a.40.2"'}],videoCapabilities:[{contentType:'video/mp4; codecs="avc1.42E01E"'}]}];try{let p=navigator.requestMediaKeySystemAccess(name,cfg).then(()=>true).catch(()=>false);return await Promise.race([p,timeout(5000)])}catch(e){return false}}async function run(){r.innerHTML=row('User agent',navigator.userAgent,null)+row('EME API',!!navigator.requestMediaKeySystemAccess,!!navigator.requestMediaKeySystemAccess);for(const [label,name] of [['ClearKey','org.w3.clearkey'],['Widevine','com.widevine.alpha'],['PlayReady','com.microsoft.playready']]){r.innerHTML+=row(label,'testing…',null);const els=r.querySelectorAll('.row');const target=els[els.length-1];const v=await ks(name);target.outerHTML=row(label,v===true?'AVAILABLE':v===false?'NOT AVAILABLE':v,v===true?true:v===false?false:null)}}document.getElementById('run').onclick=run;run();</script></body></html>
