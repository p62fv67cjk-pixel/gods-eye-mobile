name: Build God's Eye Family Hub source artifact

on:
  push:
    branches: ["main"]
    paths:
      - "fridge-tizen/**"
      - ".github/workflows/build-familyhub-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f fridge-tizen/config.xml
          test -f fridge-tizen/index.html
          test -f fridge-tizen/main.js
          test -f fridge-tizen/style.css
          test -f fridge-tizen/icon.svg

      - name: Check JavaScript syntax
        run: node --check fridge-tizen/main.js

      - name: Check Tizen config XML syntax
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('fridge-tizen/config.xml'); print('config.xml OK')"

      - name: Create source bundle
        run: |
          cd fridge-tizen
          zip -r ../GodsEye-FamilyHub-v2-source.zip config.xml index.html main.js style.css icon.svg README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsEye-FamilyHub-v2-source
          path: GodsEye-FamilyHub-v2-source.zip
          if-no-files-found: error
