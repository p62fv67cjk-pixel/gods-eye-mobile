name: Apply voice control fix
on:
  push:
    paths:
      - '.github/workflows/apply-voice-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice control
        env:
          VOICE_B64:     
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('// Push-to-talk voice control.')
          end=s.index('document.getElementById("settingsBtn").onclick', start)
          new=base64.b64decode(os.environ['VOICE_B64']).decode()
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit voice fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix iPhone voice commands" || exit 0
          git push
