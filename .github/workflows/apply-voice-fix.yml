name: Apply voice control fix
on:
  push:
    paths:
      - '.github/workflows/apply-voice-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final voice cleanup
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); s=s.replace("(?:ptease )?", "(?:please )?"); s=s.replace("voiceBtn.textContent = \"🎄️\";", "voiceBtn.textContent = \"🎙️\";"); p.write_text(s)'
      - name: Commit voice fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finish iPhone voice control fix" || exit 0
          git push
