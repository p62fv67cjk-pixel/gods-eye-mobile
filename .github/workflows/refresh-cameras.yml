name: Refresh NSW camera cache
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TfNSW Live Traffic cameras
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          key=os.environ.get('TFNSW_API_KEY','').strip()
          if not key:
              raise SystemExit('Missing repository secret TFNSW_API_KEY')
          req=urllib.request.Request(
              'https://api.transport.nsw.gov.au/v1/live/cameras',
              headers={'Authorization': 'apikey '+key, 'User-Agent':'gods-eye-mobile'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          if not isinstance(data, dict) or 'features' not in data:
              raise SystemExit('Unexpected TfNSW response')
          data['generated_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['source']='Transport for NSW Live Traffic cameras'
          os.makedirs('data',exist_ok=True)
          with open('data/cameras.json','w',encoding='utf-8') as f:
              json.dump(data,f,separators=(',',':'))
          PY
      - name: Commit updated camera cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cameras.json
          git commit -m "Refresh NSW camera cache" || exit 0
          git push
