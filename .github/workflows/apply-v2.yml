name: Apply God’s Eye v2 patch

on:
  push:
    paths:
      - 'patch_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply voice and CCTV upgrade
        run: python patch_v2.py

      - name: Commit upgraded app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit"
          else
            git commit -m "Add voice control and CCTV viewer"
            git push
          fi
